[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme>=24.1", "hatchling>=1.27" ]

[project]
name = "django-filters-mixin"
version = "0.2.1"
description = "Simple integration between django-filter and Django pagination."
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [ { name = "Basil Shubin", email = "basil.shubin@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [ "readme" ]
dependencies = [
  "django>=5.2",
  "django-filter>0.15",
]
urls.download = "https://github.com/bashu/django-filters-mixin/zipball/master"
urls.homepage = "https://github.com/bashu/django-filters-mixin/"

[dependency-groups]
dev = [
  "coverage==7.17.2",
  "django-upgrade==1.33.0",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.4",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/x-rst"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.rst" }, { text = "\n" }, { path = "CHANGES.rst" } ]
build.targets.wheel.packages = [ "src/filters" ]
build.targets.sdist.only-include = [ "src", "CHANGES.rst", "README.rst" ]

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.default-section = "third-party"
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "filters" ]
lint.isort.section-order = [ "future", "standard-library", "django", "third-party", "first-party", "local-folder" ]
lint.isort.sections.django = [ "django" ]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

# ==== coverage ====
[tool.coverage]
run.source = [ "filters" ]
run.relative_files = true
